version: '3.8'

services:
  ctf-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctf-writeup-studio
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ctf_studio_data:/app/backend/data
    restart: unless-stopped

volumes:
  ctf_studio_data:
